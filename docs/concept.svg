<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="How the orchestrator works: you drop rough notes in tasks/draft; the orchestrator reads herd.md, shapes each note into a task with a DoD, moves it across the folder board, and launches one runner agent per task in its own pane; the runner claims done, the orchestrator verifies by running the app itself and moves the task to done or fail.">
  <defs>
    <style>
      .ink   { fill: #1f2328; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .muted { fill: #5b6470; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .box   { fill: #ffffff; stroke: #c3c8d0; stroke-width: 1.5; }
      .chip  { fill: #f2f3f5; stroke: #d4d8de; stroke-width: 1; }
      .line  { stroke: #9aa2ad; stroke-width: 1.6; fill: none; }
      .gate  { stroke: #a8562a; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa2ad"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8562a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="430" rx="10" fill="#fcfcfb" stroke="#e6e6e3"/>

  <!-- you -->
  <rect class="box" x="24" y="168" width="112" height="62" rx="8"/>
  <text class="ink" x="80" y="194" font-size="15" font-weight="600" text-anchor="middle">you</text>
  <text class="muted" x="80" y="214" font-size="12" text-anchor="middle">three rough lines</text>
  <path class="line" d="M136 199 H 186" marker-end="url(#a)"/>

  <!-- board -->
  <rect class="box" x="190" y="60" width="150" height="300" rx="8"/>
  <text class="ink mono" x="265" y="84" font-size="13" font-weight="600" text-anchor="middle">tasks/</text>
  <rect class="chip" x="206" y="98"  width="118" height="30" rx="6"/>
  <text class="ink mono" x="265" y="118" font-size="12" text-anchor="middle">draft</text>
  <rect class="chip" x="206" y="140" width="118" height="30" rx="6"/>
  <text class="ink mono" x="265" y="160" font-size="12" text-anchor="middle">todo</text>
  <rect class="chip" x="206" y="182" width="118" height="30" rx="6"/>
  <text class="ink mono" x="265" y="202" font-size="12" text-anchor="middle">inprogress</text>
  <rect class="chip" x="206" y="224" width="118" height="30" rx="6"/>
  <text class="ink mono" x="265" y="244" font-size="12" text-anchor="middle">done</text>
  <rect class="chip" x="206" y="266" width="118" height="30" rx="6"/>
  <text class="ink mono" x="265" y="286" font-size="12" text-anchor="middle">fail</text>
  <text class="muted" x="265" y="326" font-size="11.5" text-anchor="middle">the folder is the state</text>
  <text class="muted mono" x="265" y="343" font-size="11.5" text-anchor="middle">moved with mv</text>

  <!-- orchestrator -->
  <rect class="box" x="392" y="132" width="196" height="118" rx="8"/>
  <text class="ink" x="490" y="163" font-size="15" font-weight="600" text-anchor="middle">ORCHESTRATOR</text>
  <text class="muted" x="490" y="186" font-size="12.5" text-anchor="middle">plan · delegate · VERIFY</text>
  <text class="muted" x="490" y="205" font-size="12.5" text-anchor="middle">one prompt, 40 lines</text>
  <text class="muted" x="490" y="228" font-size="12.5" text-anchor="middle">never writes app code</text>

  <path class="line" d="M340 150 H 386" marker-end="url(#a)"/>
  <text class="muted" x="363" y="140" font-size="11" text-anchor="middle">reads</text>
  <path class="line" d="M386 232 H 340" marker-end="url(#a)"/>
  <text class="muted" x="363" y="252" font-size="11" text-anchor="middle">moves</text>

  <!-- herd.md -->
  <rect class="box" x="392" y="300" width="196" height="66" rx="8"/>
  <text class="ink mono" x="490" y="324" font-size="13" font-weight="600" text-anchor="middle">herd.md</text>
  <text class="muted" x="490" y="344" font-size="11.5" text-anchor="middle">who it is, then 30 facts,</text>
  <text class="muted" x="490" y="359" font-size="11.5" text-anchor="middle">pruned as it writes</text>
  <path class="line" d="M446 300 V 256" marker-end="url(#a)"/>
  <text class="muted" x="408" y="280" font-size="11" text-anchor="middle">read</text>
  <path class="line" d="M534 256 V 296" marker-end="url(#a)"/>
  <text class="muted" x="566" y="280" font-size="11" text-anchor="middle">one fact</text>

  <!-- runners -->
  <rect class="box" x="662" y="96" width="214" height="80" rx="8"/>
  <text class="ink" x="769" y="124" font-size="14" font-weight="600" text-anchor="middle">runner</text>
  <text class="muted" x="769" y="144" font-size="11.5" text-anchor="middle">its own herdr pane</text>
  <text class="muted mono" x="769" y="161" font-size="11.5" text-anchor="middle">cwd = apps/hello</text>

  <rect class="box" x="662" y="204" width="214" height="80" rx="8"/>
  <text class="ink" x="769" y="232" font-size="14" font-weight="600" text-anchor="middle">runner</text>
  <text class="muted" x="769" y="252" font-size="11.5" text-anchor="middle">claude · codex · copilot</text>
  <text class="muted mono" x="769" y="269" font-size="11.5" text-anchor="middle">cwd = apps/&lt;app&gt;</text>
  <text class="muted" x="769" y="303" font-size="11.5" text-anchor="middle">max two at once</text>

  <path class="line" d="M588 160 H 656" marker-end="url(#a)"/>
  <text class="muted" x="622" y="136" font-size="11" text-anchor="middle">TASK</text>
  <text class="muted" x="622" y="150" font-size="11" text-anchor="middle">+ DoD</text>
  <path class="gate" d="M656 228 H 594" marker-end="url(#b)"/>
  <text class="ink" x="626" y="248" font-size="11" text-anchor="middle">“done”</text>
  <text class="muted" x="626" y="262" font-size="11" text-anchor="middle">a claim</text>

  <!-- gate caption -->
  <path class="gate" d="M40 386 H 860"/>
  <text class="ink" x="450" y="410" font-size="13" text-anchor="middle">VERIFY: the orchestrator runs the app itself, against every DoD line. Only it ticks a box.</text>
</svg>
